apiVersion: batch/v1
kind: CronJob
metadata:
  name: fixture-poller
  namespace: fullsend-control
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        spec:
          serviceAccountName: control
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: poller
              image: localhost/fullsend-poc:dev
              imagePullPolicy: Never
              args: ["k8s-poc", "poll-fixture"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: url
              volumeMounts:
                - name: fixture
                  mountPath: /etc/fullsend
                  readOnly: true
          volumes:
            - name: fixture
              configMap:
                name: fixture-input
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: fixture-dispatcher
  namespace: fullsend-control
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 50
      template:
        spec:
          serviceAccountName: launcher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dispatcher
              image: localhost/fullsend-poc:dev
              imagePullPolicy: Never
              args: ["k8s-poc", "dispatch"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: url
                - name: STUB_IMAGE
                  value: registry.access.redhat.com/ubi10/ubi-minimal:10.2-1790075626
                - name: FULLSEND_REPOSITORY_ID
                  valueFrom:
                    configMapKeyRef:
                      name: fullsend-mint-dispatch
                      key: repository-id
                      optional: true
