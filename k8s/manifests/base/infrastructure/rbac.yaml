apiVersion: v1
kind: ServiceAccount
metadata:
  name: control
  namespace: fullsend-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner
  namespace: fullsend-runner
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-inference
  namespace: fullsend-runner
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stub-job-launcher
  namespace: fullsend-runner
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stub-job-launcher
  namespace: fullsend-runner
subjects:
  - kind: ServiceAccount
    name: control
    namespace: fullsend-control
roleRef:
  kind: Role
  name: stub-job-launcher
  apiGroup: rbac.authorization.k8s.io
