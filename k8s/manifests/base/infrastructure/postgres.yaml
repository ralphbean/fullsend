apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fullsend-control
spec:
  selector:
    app: fullsend-poc-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: fullsend-control
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: fullsend-poc-postgres
  template:
    metadata:
      labels:
        app: fullsend-poc-postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.6
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: fullsend
            - name: POSTGRES_USER
              value: fullsend
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "fullsend", "-d", "fullsend"]
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
