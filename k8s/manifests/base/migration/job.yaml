apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: fullsend-control
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 90
  template:
    spec:
      serviceAccountName: control
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: localhost/fullsend-poc:dev
          imagePullPolicy: Never
          args: ["k8s-poc", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: url
