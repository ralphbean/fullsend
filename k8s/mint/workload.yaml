apiVersion: v1
kind: Namespace
metadata:
  name: fullsend-mint
  labels:
    app.kubernetes.io/part-of: fullsend-kind-poc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mint
  namespace: fullsend-mint
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: fullsend-mint
  namespace: fullsend-mint
spec:
  selector:
    app.kubernetes.io/name: fullsend-mint
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullsend-mint
  namespace: fullsend-mint
  labels:
    app.kubernetes.io/name: fullsend-mint
    app.kubernetes.io/part-of: fullsend-kind-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fullsend-mint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fullsend-mint
        app.kubernetes.io/part-of: fullsend-kind-poc
    spec:
      serviceAccountName: mint
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mint
          image: localhost/fullsend-k8s-mint:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: PORT
              value: "8443"
            - name: TLS_CERT_FILE
              value: /etc/fullsend-mint/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/fullsend-mint/tls/tls.key
            - name: PEM_DIR
              value: /var/run/fullsend-apps
            - name: ROLE_APP_IDS
              valueFrom:
                configMapKeyRef:
                  name: fullsend-mint-config
                  key: role-app-ids.json
            - name: KUBERNETES_MINT_CONFIG_FILE
              value: /etc/fullsend-mint/trust/policy.json
          volumeMounts:
            - name: app-pem
              mountPath: /var/run/fullsend-apps
              readOnly: true
            - name: trust
              mountPath: /etc/fullsend-mint/trust
              readOnly: true
            - name: tls
              mountPath: /etc/fullsend-mint/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: app-pem
          secret:
            secretName: fullsend-app-pem
            defaultMode: 0440
        - name: trust
          configMap:
            name: fullsend-mint-config
            items:
              - key: policy.json
                path: policy.json
              - key: jwks.json
                path: jwks.json
              - key: ca.crt
                path: ca.crt
        - name: tls
          secret:
            secretName: fullsend-mint-tls
            defaultMode: 0440
